# The Claude Code ladder from STANDARD-v2, section 7: each feature a learner must use, and the step
# that uses it. checks/ladder.ts fails when a mapped step is missing, has no check, or never shows the
# feature (the "shows" pattern must appear in the step's problem or solution files).
# A feature with no step yet is listed under [[todo]]. Each one needs a step or a new part before this
# course reaches that level. Nothing is mapped to a step that does not teach it.

[[feature]]
level = "L0"
name = "plan mode"
step = "write-the-seed-test"
shows = "show me your plan first"

[[feature]]
level = "L0"
name = "a specific prompt"
step = "write-the-seed-test"
shows = "Fill in tests/seed\\.spec\\.ts"

[[feature]]
level = "L0"
name = "screenshots"
step = "check-looks-and-access"
shows = "screenshot"

[[feature]]
level = "L2"
name = "CLAUDE.md"
step = "test-the-order-api-contract"
shows = "CLAUDE\\.md"

[[feature]]
level = "L2"
name = "a check to run"
step = "write-the-seed-test"
shows = "bun run verify"

[[feature]]
level = "L3"
name = "hooks"
step = "stop-the-healer-hiding-a-bug"
shows = "hook"

[[feature]]
level = "L3"
name = "deny rules"
step = "measure-the-agent-cost"
shows = "\"deny\""

[[feature]]
level = "L3"
name = "MCP or CLI tools"
step = "compare-mcp-and-cli"
shows = "MCP"

[[feature]]
level = "L5"
name = "subagents"
step = "redo-the-flow-with-agents"
shows = "\\.claude/agents"

[[feature]]
level = "L5"
name = "a reviewer agent"
step = "write-the-team-playbook"
shows = "reviewer"

[[feature]]
level = "L6"
name = "a GitHub Action"
step = "gate-the-pull-request"
shows = "pull_request"

[[feature]]
level = "L6"
name = "metrics"
step = "measure-the-agent-cost"
shows = "cost per"

